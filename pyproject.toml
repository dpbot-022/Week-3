[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safestrata"
version = "1.0.0"
description = "SafeStrata: Production-Grade Layered Hybrid Search RAG Pipeline with Local Hugging Face Models and Multi-Tier Guardrails"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sentence-transformers>=2.5.0",
    "chromadb>=0.4.24",
    "rank-bm25>=0.2.2",
    "networkx>=3.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9"
]

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"
