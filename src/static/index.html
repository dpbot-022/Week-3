<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeStrata • Regulatory & Compliance Answer Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <!-- Root Mount -->
  <div id="app-root">
    <div id="session-check-loader" class="auth-loading-state">
      <div class="auth-spinner"></div>
      <p class="auth-loading-text">Verifying secure session...</p>
    </div>
  </div>

  <!-- Sign-in Login Wall Template (Public View) -->
  <template id="login-template">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-brand">
          <h1 class="brand-title">SafeStrata</h1>
          <p class="brand-tagline">Internal Regulatory & Compliance Desk</p>
        </div>

        <!-- Step 1: Email Input Form -->
        <form id="form-auth-email" onsubmit="event.preventDefault(); window.handleRequestOtp();">
          <p class="auth-instructions">Sign in with your corporate email to access grounded regulatory policy documents.</p>
          <div id="auth-email-error" class="auth-alert-error" style="display: none;"></div>
          
          <div class="form-group">
            <label for="input-email" class="form-label">Email address</label>
            <input type="email" id="input-email" class="form-input" placeholder="compliance.analyst@bank.internal" required autofocus>
          </div>

          <button type="submit" id="btn-request-otp" class="btn-primary">
            <span>Continue with email</span>
          </button>
        </form>

        <!-- Step 2: 6-Digit Verification Code Form -->
        <form id="form-auth-otp" style="display: none;" onsubmit="event.preventDefault(); window.handleVerifyOtp();">
          <p class="auth-instructions">A 6-digit verification code was sent to <strong id="auth-target-email"></strong>.</p>
          <div id="auth-otp-error" class="auth-alert-error" style="display: none;"></div>

          <div class="form-group">
            <label for="input-otp" class="form-label">6-digit verification code</label>
            <input type="text" id="input-otp" class="form-input otp-digit-input" placeholder="000000" maxlength="6" pattern="\d{6}" inputmode="numeric" required autofocus>
          </div>

          <button type="submit" id="btn-verify-otp" class="btn-primary" style="margin-bottom: 12px;">
            <span>Verify and continue</span>
          </button>

          <div style="display: flex; justify-content: space-between; align-items: center;">
            <button type="button" id="btn-resend-otp" class="btn-link" disabled onclick="window.handleResendOtp()">
              Resend code (<span id="resend-timer">60</span>s)
            </button>
            <button type="button" class="btn-link" onclick="window.showEmailStep()">
              Use different email
            </button>
          </div>
        </form>

        <!-- Step 3: Success Transition -->
        <div id="auth-transition" class="auth-success-state" style="display: none;">
          <div class="auth-success-icon">✓</div>
          <div class="brand-title" id="auth-welcome-text">Signed in</div>
          <p class="brand-tagline">Loading authorized compliance workspace...</p>
        </div>
      </div>
    </div>
  </template>

  <!-- Dashboard Template: Instantiated in DOM ONLY when a valid session is verified -->
  <template id="dashboard-template">
    <div class="app-layout">
      <!-- Left Sidebar (Role-Filtered Navigation) -->
      <aside class="app-sidebar">
        <div class="sidebar-header">
          <div class="sidebar-brand">SafeStrata</div>
          <div class="sidebar-sub">Compliance Desk</div>
        </div>

        <nav class="sidebar-nav">
          <div id="nav-item-ask" class="nav-item active" onclick="window.switchView('ask')">
            <span>Ask Desk</span>
          </div>
          <div id="nav-item-library" class="nav-item" style="display: none;" onclick="window.switchView('library')">
            <span>Library</span>
          </div>
          <div id="nav-item-quality" class="nav-item" style="display: none;" onclick="window.switchView('quality')">
            <span>Quality & Evals</span>
          </div>
          <div id="nav-item-admin" class="nav-item" style="display: none;" onclick="window.switchView('admin')">
            <span>Admin & Audit</span>
          </div>
        </nav>

        <div class="sidebar-footer">
          <div>Grounding: 100% Policy-Backed</div>
          <div style="margin-top: 4px;">Zero General Knowledge</div>
        </div>
      </aside>

      <!-- Main Workspace -->
      <main class="app-main">
        <!-- Header -->
        <header class="app-header">
          <div class="header-title-group">
            <h2 id="view-title" class="header-title">Compliance Policy Assistant</h2>
          </div>

          <div class="header-actions">
            <span id="header-user-email" class="user-email-text">user@internal.bank</span>
            <span id="header-user-role" class="role-badge">Analyst</span>
            <button id="btn-logout" class="btn-signout" onclick="window.handleLogout()">Sign out</button>
          </div>
        </header>

        <!-- Dynamic View Content Container -->
        <div id="view-content" class="view-container">
          <!-- Views will be mounted here -->
        </div>

        <!-- Right-hand Source Panel (Citation Inspector) -->
        <div id="source-panel" class="source-panel">
          <div class="panel-header">
            <div class="panel-title">Source Citation Verification</div>
            <button class="panel-close-btn" onclick="window.closeSourcePanel()">&times;</button>
          </div>
          <div class="panel-body">
            <div class="source-meta-row">
              <div class="source-meta-item">
                <span class="source-meta-label">Document:</span>
                <span id="panel-doc-title" class="source-meta-val">-</span>
              </div>
              <div class="source-meta-item">
                <span class="source-meta-label">Page Number:</span>
                <span id="panel-page-num" class="source-meta-val">-</span>
              </div>
              <div class="source-meta-item">
                <span class="source-meta-label">Effective Date:</span>
                <span id="panel-effective-date" class="source-meta-val">Verified</span>
              </div>
              <div class="source-meta-item">
                <span class="source-meta-label">Relevance Score:</span>
                <span id="panel-score" class="source-meta-val">-</span>
              </div>
            </div>

            <div class="form-label">Evidence Passage:</div>
            <div id="panel-evidence-text" class="source-text-block"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Trace Telemetry Drawer Modal -->
    <div id="trace-modal" class="modal-overlay" style="display: none;" onclick="if(event.target===this) window.closeTraceModal()">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="panel-title">Why This Answer? • Execution Telemetry</h3>
          <button class="panel-close-btn" onclick="window.closeTraceModal()">&times;</button>
        </div>
        <div class="modal-body">
          <div class="trace-grid">
            <div class="trace-box">
              <div class="trace-box-label">Generation Mode</div>
              <div id="trace-mode" class="trace-box-val">-</div>
            </div>
            <div class="trace-box">
              <div class="trace-box-label">Faithfulness Score</div>
              <div id="trace-faithfulness" class="trace-box-val">-</div>
            </div>
            <div class="trace-box">
              <div class="trace-box-label">Total Latency</div>
              <div id="trace-total-latency" class="trace-box-val">-</div>
            </div>
            <div class="trace-box">
              <div class="trace-box-label">Active Model</div>
              <div id="trace-model-name" class="trace-box-val">qwen2.5:3b-instruct</div>
            </div>
          </div>

          <h4 class="form-label" style="margin-top: 16px;">Stage Latencies</h4>
          <div id="trace-latencies-table" class="data-table-container" style="margin-bottom: 16px;"></div>

          <h4 class="form-label">Reranking Comparison (Before vs After)</h4>
          <div id="trace-ranks-table" class="data-table-container"></div>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" onclick="window.closeTraceModal()">Close</button>
        </div>
      </div>
    </div>

    <!-- Report Wrong Answer Modal -->
    <div id="report-modal" class="modal-overlay" style="display: none;" onclick="if(event.target===this) window.closeReportModal()">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="panel-title">Report Wrong or Hallucinated Answer</h3>
          <button class="panel-close-btn" onclick="window.closeReportModal()">&times;</button>
        </div>
        <div class="modal-body">
          <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 16px;">
            Your report will be audited by the compliance management and quality evaluation review team.
          </p>
          <div class="form-group">
            <label class="form-label">Reason for Report</label>
            <textarea id="report-reason" class="form-input" rows="3" placeholder="Explain discrepancy against official regulatory policy..." required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" onclick="window.closeReportModal()">Cancel</button>
          <button class="btn-primary" style="width: auto;" onclick="window.submitWrongAnswerReport()">Submit Report</button>
        </div>
      </div>
    </div>

    <!-- Chunk Preview Modal -->
    <div id="chunks-modal" class="modal-overlay" style="display: none;" onclick="if(event.target===this) window.closeChunksModal()">
      <div class="modal-content" style="max-width: 800px;">
        <div class="modal-header">
          <h3 class="panel-title" id="chunks-modal-title">Document Chunks Preview</h3>
          <button class="panel-close-btn" onclick="window.closeChunksModal()">&times;</button>
        </div>
        <div class="modal-body" id="chunks-modal-body"></div>
        <div class="modal-footer">
          <button class="btn-secondary" onclick="window.closeChunksModal()">Close</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Local Sanitizer & Markdown Scripts -->
  <script src="/static/purify.min.js"></script>
  <script src="/static/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
