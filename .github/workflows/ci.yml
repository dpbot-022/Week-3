name: CI Pipeline - Hybrid RAG & Guardrails

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Quality Gates & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=src --cov-report=term-missing --cov-fail-under=85 tests/

      - name: Linting & Schema Validation
        run: |
          python -c "import src.schemas.models; print('Pydantic schemas validated successfully!')"
