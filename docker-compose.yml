version: '3.8'

services:
  rag-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_hybrid_rag
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PROJECT_NAME=Enterprise Hybrid RAG & Guardrails Pipeline
      - HOST=0.0.0.0
      - PORT=8001
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - LLM_PROVIDER=local
      - GUARDRAILS_ENABLED=true
    volumes:
      - chroma_data:/app/data/chroma
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  chroma_data:
    driver: local
